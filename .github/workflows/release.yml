name: Windows release

# Only a version tag (v0.2.0, v0.3.0, ...) builds the installer and publishes a release.
# Ordinary pushes to master build nothing.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The tag must match the app version, and the version must have a CHANGELOG section,
      # so a release never ships with the wrong number or without a description.
      - name: Check version
        id: meta
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          VERSION="$version" node scripts/release-notes.mjs release-notes.md
          cat release-notes.md

      # Static GPL build with libass, needed to burn subtitles into video. BtbN renames the stable
      # assets as versions age, so pick the newest "nX.Y-latest" one and fall back to master.
      - name: Bundle ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | node -e "const a=JSON.parse(require('fs').readFileSync(0,'utf8')).assets.map(x=>x.browser_download_url);const s=a.filter(u=>/ffmpeg-n[\d.]+-latest-win64-gpl-[\d.]+\.zip$/.test(u)).sort().pop();console.log(s||a.find(u=>u.endsWith('ffmpeg-master-latest-win64-gpl.zip'))||'')")
          if [ -z "$url" ]; then echo "No ffmpeg build found"; exit 1; fi
          echo "ffmpeg: $url"
          curl -fsSL "$url" -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg
          mkdir -p src-tauri/binaries
          cp "$(find ffmpeg -name ffmpeg.exe | head -n 1)" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          filters=$(src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -filters)
          if ! grep -q ' ass ' <<< "$filters"; then echo "ffmpeg without libass"; exit 1; fi

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Subber ${{ steps.meta.outputs.version }}
          body_path: release-notes.md
          make_latest: true
          files: src-tauri/target/release/bundle/nsis/*.exe
