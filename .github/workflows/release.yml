name: Windows release

# Every push to master builds the Windows installer and publishes it as a GitHub release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Static GPL build with libass, needed to burn subtitles into video.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Version and tags
        id: meta
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Building $tag (previous: ${previous:-none})"

      - name: Bundle ffmpeg
        run: |
          curl -fsSL "$FFMPEG_URL" -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg
          mkdir -p src-tauri/binaries
          cp "$(find ffmpeg -name ffmpeg.exe | head -n 1)" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -filters | grep -q ' ass ' || { echo "ffmpeg without libass"; exit 1; }

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Release notes
        env:
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous }}
        run: node scripts/release-notes.mjs release-notes.md && cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Subber ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          make_latest: true
          files: src-tauri/target/release/bundle/nsis/*.exe
