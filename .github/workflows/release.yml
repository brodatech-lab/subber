name: Windows release

# Every push to master builds the Windows installer and publishes it as a GitHub release.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels a build still running. Nothing is lost: the next release notes list every commit
# since the last published build.
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Version and tags
        id: meta
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Building $tag (previous: ${previous:-none})"

      # Static GPL build with libass, needed to burn subtitles into video. BtbN renames the stable
      # assets as versions age, so pick the newest "nX.Y-latest" one and fall back to master.
      - name: Bundle ffmpeg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest \
            | node -e "const a=JSON.parse(require('fs').readFileSync(0,'utf8')).assets.map(x=>x.browser_download_url);const s=a.filter(u=>/ffmpeg-n[\d.]+-latest-win64-gpl-[\d.]+\.zip$/.test(u)).sort().pop();console.log(s||a.find(u=>u.endsWith('ffmpeg-master-latest-win64-gpl.zip'))||'')")
          if [ -z "$url" ]; then echo "No ffmpeg build found"; exit 1; fi
          echo "ffmpeg: $url"
          curl -fsSL "$url" -o ffmpeg.zip
          unzip -q ffmpeg.zip -d ffmpeg
          mkdir -p src-tauri/binaries
          cp "$(find ffmpeg -name ffmpeg.exe | head -n 1)" src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
          filters=$(src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe -hide_banner -filters)
          if ! grep -q ' ass ' <<< "$filters"; then echo "ffmpeg without libass"; exit 1; fi

      - name: Build installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json

      - name: Release notes
        env:
          PREVIOUS_TAG: ${{ steps.meta.outputs.previous }}
        run: node scripts/release-notes.mjs release-notes.md && cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Subber ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          body_path: release-notes.md
          make_latest: true
          files: src-tauri/target/release/bundle/nsis/*.exe
