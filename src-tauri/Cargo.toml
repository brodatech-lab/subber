[package]
name = "subber"
version = "0.1.0"
description = "Subber – automatyczne napisy z edytorem osi czasu"
authors = ["Subber"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "subber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
keyring = { version = "3", features = ["windows-native"] }
rustls-native-certs = "0.8"
base64 = "0.22"
fs2 = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
